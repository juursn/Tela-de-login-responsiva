<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <link rel="stylesheet" href="style/style.css" media="all">
    <link rel="stylesheet" href="style/media-queries.css" media="screen">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="foto">
                <!-- Aquiva vai a imagem do login -->
            </div>
            <div id="form">
                <h1>Login</h1>
                <p>Seja Bem-vindo(a)! Faça seu login para acessar suas informações.</p>
                <form action="#" method="post" autocomplete="on">
                    <div class="campo">
                        <i class="material-symbols-outlined">person</i>
                        <input type="email" name="email" id="Email" placeholder="Digite seu email" autocomplete="email" maxlength="30">
                        <label for="Email">Email</label>
                    </div>
                    <div class="campo">
                        <i class="material-symbols-outlined">key</i>
                        <input type="password" name="senha" id="Senha" placeholder="Digite sua senha" autocomplete="current-password" min="8" max="20">
                        <label for="Senha">Senha</label>

                    </div>
                    <input type="submit" value="Entrar">
                    <a href="#"class="button-esq">Esqueci minha senha <i class="material-symbols-outlined" >email</i></a>
                </form>
            </div>
                    
        </section>
    </main>
</body>
</html>
